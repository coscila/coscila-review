schema_version = 1

# The tracked input locks constrain the one operator-only solve. A successful
# template build exports an @EXPLICIT package list, addresses the template by
# that list's SHA-256, and stores both outside this source checkout. Chat-time
# clone and rebuild operations are permitted to consume only those artifacts.

[[environment]]
id = "review-core"
purpose = "Shared review orchestration, structured records, tabular exchange, and validation"
spec = "specs/review-core.yaml"
input_lock = "locks/review-core.input-lock.yaml"
input_lock_sha256 = "4e41f20cb63125fc7eeda9d2ac08c03ed8cf3700f2c1d6721fb52fdd5281d6f5"
platforms = ["linux-64", "linux-aarch64"]
channels = ["conda-forge"]
health_checks = [
  ["python", "-c", "import httpx, jsonschema, pandas, pyarrow, pydantic, yaml"],
]
skills = [
  "ocsl-review-router",
  "ocsl-review-reporting-guidelines",
  "ocsl-review-reproducibility-data-code",
  "ocsl-review-ethics-transparency",
  "ocsl-review-environments",
]


schema_version = 1
id = "ocsl-review-followup-audit"
title = "Compromised-evidence dependency audit"
summary = "Branch a frozen citation census, give every cited work a dated retraction, correction or concern status, and build the follow-up audit's strata, statistics, facts and exports in any chat; its model judgments need a run principal's broker socket."
primary_environment = "review-literature"
secondary_environments = ["review-statistics"]
mcps = ["ocsl_review_catalog", "ocsl_scholar"]
outputs = ["work/followup/followup.sqlite3", "results/followup/facts.json", "results/followup/facts.sqlite3", "results/followup/exports/manifest.json"]
confidential_by_default = true

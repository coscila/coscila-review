[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ocsl-review"
version = "0.1.0"
description = "Evidence-chain review companion for OC Science Lab"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Philipp Flotho", email = "PhilippFlotho@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
documents = ["python-docx>=1.1", "pypdf>=5.0"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
ocsl-review = "ocsl_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

